# The app's own web server: static files from web/, everything else through
# Symfony's front controller. Realtime (/centrifugo/) is routed by the app's
# router in front of this container, not here.
server {
    listen 80 default_server;
    root /var/www/html/web;
    absolute_redirect off;

    client_max_body_size 32m;
    large_client_header_buffers 8 32k;

    location = /_health { access_log off; return 204; }

    location ~* ^/images/avatars/.*$ {
        try_files $uri /index.php$is_args$args;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location /build/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ { return 404; }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
